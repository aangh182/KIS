[project]
name = "kis"
version = "0.1.0"
description = "KIS video retrieval — self keyframe pipeline (CPU-only)"
readme = "README.md"
authors = [
    { name = "Nguyễn Hoàng Ân", email = "24520056@gm.uit.edu.vn" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "pydantic-settings>=2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
offline = [
    "av>=13",
    "scenedetect>=0.6",
    "imagehash>=4.3",
]
embed = [
    "faiss-cpu>=1.9",
    "sentencepiece>=0.2",
    "torch>=2.4",
    "transformers>=4.50",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
ocr = ["rapidocr-onnxruntime>=1.4"]
asr = ["faster-whisper>=1.0"]

[tool.uv]
# CPU-only torch: avoid pulling the ~2.5 GB CUDA wheel on Linux.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.scripts]
kis = "kis:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
